[project]
name = "devmate"
version = "0.1.0"
description = "DevMate —— 开源、可自部署、多模型路由、多渠道接入的开发场景 Agent"
requires-python = ">=3.11"

# 版本说明：用 ">=" 下限，uv 自动解析到当前最新可用版本。
dependencies = [
    # ===== Agent 核心 =====
    "deepagents>=0.6.0",                  # Harness 层（本项目主角）
    "langchain>=1.1.0",                   # 构建模块（init_chat_model / 模型 profiles）
    "langgraph>=1.1.0",                   # 编排运行时（checkpointer / streaming / HITL）
    "langchain-openai>=0.3.0",            # 模型集成包（国产模型走 OpenAI 兼容接口）
    # ===== 持久化底座 + 异步驱动栈（先备好） =====
    "langgraph-checkpoint-postgres>=3.0.0",  # PostgresSaver / AsyncPostgresSaver + store
    "psycopg[binary,pool]>=3.2.0",           # Postgres 驱动（psycopg3）+ 异步连接池（后续用）
    "redis>=5.0.0",                          # Redis 客户端，自带 redis.asyncio 异步接口
    # ===== Web 服务（后续起用，先备好） =====
    "fastapi>=0.115.0",                   # 异步 Web 框架
    "uvicorn[standard]>=0.30.0",          # ASGI 服务器
    # ===== 配置与日志 =====
    "loguru>=0.7.0",
    "pydantic-settings>=2.0.0",           # 配置体系
    "python-dotenv>=1.0.0",               # 加载 .env
    # ===== 测试 =====
    "pytest>=8.0.0",                      # 单元测试框架（DevMate 的 run_pytest 工具依赖它）
    "lark-oapi>=1.7.3",
    "arq>=0.28.0",
]

[project.optional-dependencies]
# MCP（可选）
mcp = ["langchain-mcp-adapters>=0.1.0"]
# 沙箱：基础接入 / 沙箱池（需要时 uv sync --extra sandbox 再装）
# 注意：DeepAgents 接 Daytona 需要两个包：langchain-daytona（backend 适配）
# 和它依赖的 Daytona 官方 SDK daytona（from daytona import Daytona）。
sandbox = ["langchain-daytona>=0.0.1", "daytona>=0.40.0"]
# Redis 作为 checkpointer/store（可选，需 Redis Stack）
redis-graph = ["langgraph-checkpoint-redis>=0.4.0"]
# 独立向量库（PostgresStore 已含 pgvector，独立 RAG 时才需要）
vectorstore = ["langchain-postgres>=0.0.12"]
# 任务队列 + 限流（后台长任务 / 并发治理）
serving = ["arq>=0.26.0", "slowapi>=0.1.9", "sse-starlette>=2.1.0"]
# 多副本部署
deploy = ["gunicorn>=22.0.0"]
# 可观测 + 压测
obs = ["langsmith>=0.3.0", "prometheus-client>=0.20.0", "locust>=2.29.0"]

[tool.uv]
# DevMate 是应用项目（不发布到 PyPI），不需要把自己打成包。
# 设为非包项目：uv sync 只装依赖、不构建本项目本身。
package = false

[tool.pytest.ini_options]
# 明确收集边界：只跑 tests/ 与 scripts/ 下的 test_*.py。
# 不写这条的话 pytest 会递归扫到 work/（本地临时目录，已被 gitignore），
# 把别人留下的测试也算进结果里。
testpaths = ["tests", "scripts"]
